plugins {
    id 'com.android.application'
}

android {
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols.add("**/libxmrig.so")
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    namespace 'org.openmininggateway.miner'
    compileSdk 35

    defaultConfig {
        ndk {
            abiFilters 'arm64-v8a'
        }
        applicationId 'org.openmininggateway.sadaqahminer'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
